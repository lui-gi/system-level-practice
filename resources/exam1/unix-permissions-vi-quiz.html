<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unix Permissions &amp; vi Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="qz-wrap">
  <div class="qz-header">
    <span class="qz-badge">Weeks 2–3</span>
    <div class="qz-title">Unix Permissions &amp; vi Editor</div>
    <div class="qz-desc">chmod, file permissions (symbolic &amp; octal), vi editor commands</div>
  </div>
  <div id="quiz-body"></div>
  <button class="submit-btn" id="submit-btn" onclick="grade()">Submit Quiz</button>
  <div id="results"></div>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  .qz-wrap { font-family: 'Poppins', system-ui, sans-serif; max-width: 720px; color: #171717; }
  .qz-header { margin-bottom: 1.5rem; }
  .qz-badge { font-size: .6rem; font-weight: 500; letter-spacing: .1em;
    text-transform: uppercase; padding: .2rem .6rem; border-radius: .375rem;
    display: inline-block; margin-bottom: .4rem;
    background: #f5f5f5; color: #737373; border: 1px solid #e5e5e5; }
  .qz-title { font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; margin: .25rem 0 .4rem; }
  .qz-desc  { color: #737373; font-size: .875rem; line-height: 1.5; }
  .q-card { border: 1px solid #e5e5e5; border-radius: .375rem; padding: 1.25rem; margin-bottom: 1rem; }
  .q-type { font-size: .6rem; font-weight: 500; letter-spacing: .1em;
    text-transform: uppercase; padding: .15rem .5rem; border-radius: .25rem;
    display: inline-block; margin-bottom: .6rem;
    background: #f5f5f5; color: #737373; border: 1px solid #e5e5e5; }
  .q-prompt { margin: .5rem 0 .75rem; font-size: .9rem; line-height: 1.6; }
  pre { background: #111; color: #e5e5e5; padding: .9rem 1rem;
    border-radius: .375rem; overflow-x: auto; font-size: .8rem;
    border-left: 3px solid hsl(173,53%,19%); margin: .75rem 0; white-space: pre; }
  .mcq-opts { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
  .mcq-btn { padding: .375rem .875rem; border: 1.5px solid #e5e5e5;
    border-radius: .375rem; background: #fff; cursor: pointer; color: #171717;
    font-size: .875rem; font-family: 'Poppins', sans-serif; transition: all .15s; }
  .mcq-btn:hover:not(:disabled) { border-color: hsl(173,53%,19%); background: #f5f5f5; }
  .mcq-btn.selected { border-color: hsl(173,53%,19%); background: hsl(173,30%,94%); font-weight: 500; }
  .mcq-btn:disabled { cursor: default; }
  .mcq-btn.correct { border-color: #16a34a; background: #dcfce7; color: #166534; }
  .mcq-btn.wrong   { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
  .trace-input { width: 100%; margin-top: .5rem; padding: .5rem;
    font-family: 'Poppins', monospace; font-size: .875rem; border: 1.5px solid #e5e5e5;
    border-radius: .375rem; resize: vertical; min-height: 60px; color: #171717; }
  .trace-input:focus { outline: none; border-color: hsl(173,53%,19%); }
  .trace-input:disabled { background: #f9fafb; }
  .submit-btn { display: block; margin: 1.5rem auto; padding: .5rem 2rem;
    background: hsl(173,53%,19%); color: #fafafa; border: none; border-radius: .375rem;
    font-size: .875rem; font-weight: 500; font-family: 'Poppins', sans-serif;
    cursor: pointer; transition: opacity .15s; }
  .submit-btn:hover { opacity: .88; }
  .submit-btn:disabled { opacity: .45; cursor: default; }
  #results { display: none; border-top: 1px solid #e5e5e5; padding-top: 1.25rem; margin-top: 1rem; }
  .score-head { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
  .r-row { padding: .6rem .75rem; border-radius: .375rem; margin-bottom: .5rem; font-size: .875rem; }
  .r-correct { background: #dcfce7; color: #166534; }
  .r-wrong   { background: #fee2e2; color: #991b1b; }
  .r-exp { font-size: .8rem; margin-top: .25rem; opacity: .85; }
</style>

<script>
const questions = [
  {
    id: 1,
    type: "mcq",
    prompt: "In the permission string <code>r-xrwx--x</code>, what can 'others' do?",
    options: [
      "A) Read and execute",
      "B) Read, write, and execute",
      "C) Execute only",
      "D) Nothing"
    ],
    answer: "C) Execute only",
    explanation: "Permissions are grouped as user (r-x), group (rwx), others (--x). The others section <code>--x</code> means execute only — no read, no write."
  },
  {
    id: 2,
    type: "trace",
    prompt: "Write the chmod command to add write permission for the owner of <code>file.txt</code>.",
    answer: "chmod u+w file.txt",
    explanation: "<code>u</code> refers to the user (owner), <code>+w</code> adds write permission. Full command: <code>chmod u+w file.txt</code>."
  },
  {
    id: 3,
    type: "mcq",
    prompt: "What octal value gives: user=rwx, group=r-x, others=r-x?",
    options: ["A) 744", "B) 755", "C) 777", "D) 711"],
    answer: "B) 755",
    explanation: "r=4, w=2, x=1. user: 4+2+1=7, group: 4+0+1=5, others: 4+0+1=5 → octal 755."
  },
  {
    id: 4,
    type: "trace",
    prompt: "Write the chmod command (octal) so only the user can read/write/execute and group/others can only execute.",
    answer: "chmod 711 file.txt",
    explanation: "user: 4+2+1=7, group: 0+0+1=1, others: 0+0+1=1 → octal 711. Command: <code>chmod 711 file.txt</code>."
  },
  {
    id: 5,
    type: "mcq",
    prompt: "In vi, which command deletes lines 2 through 10?",
    options: ["A) :d 2-10", "B) :2,10d", "C) dd 2 10", "D) :delete 2 10"],
    answer: "B) :2,10d",
    explanation: "In vi's ex command mode, <code>:2,10d</code> specifies a range (lines 2–10) followed by the delete command <code>d</code>."
  },
  {
    id: 6,
    type: "mcq",
    prompt: "What does <code>3yy</code> do in vi?",
    options: [
      "A) Yanks (copies) 3 lines",
      "B) Deletes 3 lines",
      "C) Pastes 3 times",
      "D) Undoes 3 actions"
    ],
    answer: "A) Yanks (copies) 3 lines",
    explanation: "<code>yy</code> yanks (copies) the current line. Prefixing with a count <code>3yy</code> yanks 3 lines starting from the cursor line into the unnamed register."
  },
  {
    id: 7,
    type: "mcq",
    prompt: "What does <code>:1,3t 10</code> do in vi?",
    options: [
      "A) Deletes lines 1–3 and moves them after line 10",
      "B) Copies lines 1–3 and pastes them after line 10",
      "C) Replaces lines 1–3 with line 10",
      "D) Marks lines 1–3"
    ],
    answer: "B) Copies lines 1–3 and pastes them after line 10",
    explanation: "The <code>t</code> (copy) ex command copies the addressed lines to after the given destination. <code>:1,3t 10</code> copies lines 1–3 and places the copy after line 10. The original lines remain."
  },
  {
    id: 8,
    type: "mcq",
    prompt: "In vi, which command saves the file and quits?",
    options: ["A) :q!", "B) :w", "C) :wq", "D) :x only"],
    answer: "C) :wq",
    explanation: "<code>:wq</code> writes (saves) the file and then quits. <code>:q!</code> quits without saving. <code>:w</code> saves but does not quit."
  },
  {
    id: 9,
    type: "mcq",
    prompt: "Which vi command switches from normal mode to insert mode?",
    options: ["A) i", "B) e", "C) a only", "D) s"],
    answer: "A) i",
    explanation: "<code>i</code> enters insert mode before the cursor. (Note: <code>a</code> also enters insert mode but after the cursor — <code>i</code> is the canonical answer here.)"
  },
  {
    id: 10,
    type: "mcq",
    prompt: "What permissions does <code>chmod 644 file.txt</code> set?",
    options: [
      "A) User: rwx, Group: r--, Others: r--",
      "B) User: rw-, Group: r--, Others: r--",
      "C) User: rw-, Group: rw-, Others: r--",
      "D) User: r--, Group: r--, Others: r--"
    ],
    answer: "B) User: rw-, Group: r--, Others: r--",
    explanation: "6 = 4+2 = rw-, 4 = r--. So user gets rw- (6), group gets r-- (4), others get r-- (4)."
  }
];

const container = document.getElementById("quiz-body");
questions.forEach((q, i) => {
  const card = document.createElement("div");
  card.className = "q-card";
  card.innerHTML = `
    <span class="q-type type-${q.type}">${q.type}</span>
    <p class="q-prompt"><strong>Q${i+1}.</strong> ${q.prompt}</p>
    ${q.code ? `<pre>${q.code}</pre>` : ""}
    <div id="input-${q.id}"></div>`;
  container.appendChild(card);

  const inputArea = document.getElementById(`input-${q.id}`);
  if (q.type === "mcq") {
    const wrap = document.createElement("div");
    wrap.className = "mcq-opts";
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "mcq-btn";
      btn.textContent = opt;
      btn.onclick = () => {
        wrap.querySelectorAll(".mcq-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      };
      wrap.appendChild(btn);
    });
    inputArea.appendChild(wrap);
  } else {
    const ta = document.createElement("textarea");
    ta.className = "trace-input";
    ta.id = `ta-${q.id}`;
    ta.placeholder = "Type your answer…";
    inputArea.appendChild(ta);
  }
});

function grade() {
  let correct = 0;
  const rows = [];
  questions.forEach((q, i) => {
    let userAns = "";
    if (q.type === "mcq") {
      const sel = document.querySelector(`#input-${q.id} .mcq-btn.selected`);
      userAns = sel ? sel.textContent.trim() : "";
      document.querySelectorAll(`#input-${q.id} .mcq-btn`).forEach(btn => {
        btn.disabled = true;
        if (btn.textContent.trim() === q.answer) btn.classList.add("correct");
        else if (btn.classList.contains("selected")) btn.classList.add("wrong");
      });
    } else {
      const ta = document.getElementById(`ta-${q.id}`);
      userAns = ta ? ta.value.trim() : "";
      ta.disabled = true;
    }
    const ok = userAns === q.answer;
    if (ok) correct++;
    rows.push({ q, i, ok, userAns });
  });

  const res = document.getElementById("results");
  res.style.display = "block";
  const pct = Math.round(correct / questions.length * 100);
  res.innerHTML = `
    <div class="score-head">Score: ${correct} / ${questions.length} (${pct}%)</div>
    ${rows.map(({q, i, ok, userAns}) => `
      <div class="r-row ${ok ? "r-correct" : "r-wrong"}">
        ${ok ? "✓" : "✗"} <strong>Q${i+1}</strong>
        ${ok ? "— Correct" : `— Your answer: <code>${userAns || "(none)"}</code> &nbsp;|&nbsp; Expected: <code>${q.answer}</code>`}
        ${!ok ? `<div class="r-exp">${q.explanation}</div>` : ""}
      </div>`).join("")}`;
  document.getElementById("submit-btn").disabled = true;
}
</script>
</body>
</html>
