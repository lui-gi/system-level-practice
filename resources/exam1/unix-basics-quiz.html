<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unix Basics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="qz-wrap">
  <div class="qz-header">
    <span class="qz-badge">Weeks 1–3</span>
    <div class="qz-title">Unix Basics</div>
    <div class="qz-desc">Common utilities, paths, file operations, terminal</div>
  </div>
  <div id="quiz-body"></div>
  <button class="submit-btn" id="submit-btn" onclick="grade()">Submit Quiz</button>
  <div id="results"></div>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  .qz-wrap { font-family: 'Poppins', system-ui, sans-serif; max-width: 720px; color: #171717; }
  .qz-header { margin-bottom: 1.5rem; }
  .qz-badge { font-size: .6rem; font-weight: 500; letter-spacing: .1em;
    text-transform: uppercase; padding: .2rem .6rem; border-radius: .375rem;
    display: inline-block; margin-bottom: .4rem;
    background: #f5f5f5; color: #737373; border: 1px solid #e5e5e5; }
  .qz-title { font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; margin: .25rem 0 .4rem; }
  .qz-desc  { color: #737373; font-size: .875rem; line-height: 1.5; }
  .q-card { border: 1px solid #e5e5e5; border-radius: .375rem; padding: 1.25rem; margin-bottom: 1rem; }
  .q-type { font-size: .6rem; font-weight: 500; letter-spacing: .1em;
    text-transform: uppercase; padding: .15rem .5rem; border-radius: .25rem;
    display: inline-block; margin-bottom: .6rem;
    background: #f5f5f5; color: #737373; border: 1px solid #e5e5e5; }
  .q-prompt { margin: .5rem 0 .75rem; font-size: .9rem; line-height: 1.6; }
  pre { background: #111; color: #e5e5e5; padding: .9rem 1rem;
    border-radius: .375rem; overflow-x: auto; font-size: .8rem;
    border-left: 3px solid hsl(173,53%,19%); margin: .75rem 0; white-space: pre; }
  .mcq-opts { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
  .mcq-btn { padding: .375rem .875rem; border: 1.5px solid #e5e5e5;
    border-radius: .375rem; background: #fff; cursor: pointer; color: #171717;
    font-size: .875rem; font-family: 'Poppins', sans-serif; transition: all .15s; }
  .mcq-btn:hover:not(:disabled) { border-color: hsl(173,53%,19%); background: #f5f5f5; }
  .mcq-btn.selected { border-color: hsl(173,53%,19%); background: hsl(173,30%,94%); font-weight: 500; }
  .mcq-btn:disabled { cursor: default; }
  .mcq-btn.correct { border-color: #16a34a; background: #dcfce7; color: #166534; }
  .mcq-btn.wrong   { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
  .trace-input { width: 100%; margin-top: .5rem; padding: .5rem;
    font-family: 'Poppins', monospace; font-size: .875rem; border: 1.5px solid #e5e5e5;
    border-radius: .375rem; resize: vertical; min-height: 60px; color: #171717; }
  .trace-input:focus { outline: none; border-color: hsl(173,53%,19%); }
  .trace-input:disabled { background: #f9fafb; }
  .submit-btn { display: block; margin: 1.5rem auto; padding: .5rem 2rem;
    background: hsl(173,53%,19%); color: #fafafa; border: none; border-radius: .375rem;
    font-size: .875rem; font-weight: 500; font-family: 'Poppins', sans-serif;
    cursor: pointer; transition: opacity .15s; }
  .submit-btn:hover { opacity: .88; }
  .submit-btn:disabled { opacity: .45; cursor: default; }
  #results { display: none; border-top: 1px solid #e5e5e5; padding-top: 1.25rem; margin-top: 1rem; }
  .score-head { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
  .r-row { padding: .6rem .75rem; border-radius: .375rem; margin-bottom: .5rem; font-size: .875rem; }
  .r-correct { background: #dcfce7; color: #166534; }
  .r-wrong   { background: #fee2e2; color: #991b1b; }
  .r-exp { font-size: .8rem; margin-top: .25rem; opacity: .85; }
</style>

<script>
const questions = [
  {
    id: 1,
    type: "mcq",
    prompt: "What does <code>ls -a</code> do?",
    options: [
      "A) Lists files sorted by time",
      "B) Lists all files including hidden ones",
      "C) Lists files with long format",
      "D) Lists only directories"
    ],
    answer: "B) Lists all files including hidden ones",
    explanation: "The <code>-a</code> flag shows all files, including hidden files whose names begin with a dot (e.g., <code>.bashrc</code>). Use <code>-l</code> for long format, <code>-t</code> for time sort."
  },
  {
    id: 2,
    type: "mcq",
    prompt: "Which command counts the number of lines in a file?",
    options: [
      "A) wc -l file.txt",
      "B) wc -c file.txt",
      "C) wc -w file.txt",
      "D) wc -cl file.txt"
    ],
    answer: "A) wc -l file.txt",
    explanation: "<code>wc -l</code> counts lines, <code>wc -w</code> counts words, <code>wc -c</code> counts bytes/characters."
  },
  {
    id: 3,
    type: "mcq",
    prompt: "What happens if you run <code>rmdir dir</code> and <code>dir</code> is not empty?",
    options: [
      "A) It deletes the directory anyway",
      "B) It fails with an error; use `rm -r dir` instead",
      "C) It moves the directory to trash",
      "D) It prompts for confirmation"
    ],
    answer: "B) It fails with an error; use `rm -r dir` instead",
    explanation: "<code>rmdir</code> only removes empty directories. If the directory contains files or subdirectories, use <code>rm -r dir</code> to remove it recursively."
  },
  {
    id: 4,
    type: "mcq",
    prompt: "Which command shows the current terminal settings?",
    options: [
      "A) stty -a",
      "B) man terminal -a",
      "C) set terminal -a",
      "D) show settings -a"
    ],
    answer: "A) stty -a",
    explanation: "<code>stty -a</code> prints all current terminal settings, including baud rate, control characters, and flags."
  },
  {
    id: 5,
    type: "mcq",
    prompt: "What is the key difference between <code>cat</code> and <code>more</code>?",
    options: [
      "A) `cat` works only on text files",
      "B) `more` displays output one page at a time; `cat` dumps everything at once",
      "C) They are identical",
      "D) `more` can edit files"
    ],
    answer: "B) `more` displays output one page at a time; `cat` dumps everything at once",
    explanation: "<code>cat</code> concatenates and prints entire file contents immediately. <code>more</code> pages through the output, pausing at each screenful."
  },
  {
    id: 6,
    type: "mcq",
    prompt: "What does <code>cp -ir src/ dst/</code> do?",
    options: [
      "A) Moves src/ to dst/",
      "B) Deletes src/ after copying",
      "C) Recursively copies src/ to dst/, prompting before overwriting",
      "D) Creates a symlink"
    ],
    answer: "C) Recursively copies src/ to dst/, prompting before overwriting",
    explanation: "<code>-r</code> copies directories recursively; <code>-i</code> prompts interactively before overwriting existing files."
  },
  {
    id: 7,
    type: "trace",
    prompt: "Write the command to rename <code>file1.txt</code> to <code>new.txt</code>.",
    answer: "mv file1.txt new.txt",
    explanation: "<code>mv</code> moves (or renames) files. <code>mv file1.txt new.txt</code> renames file1.txt to new.txt in the same directory."
  },
  {
    id: 8,
    type: "mcq",
    prompt: "What does the <code>-r</code> flag do in <code>sftp&gt; get -r remote_dir</code>?",
    options: [
      "A) Resumes an interrupted transfer",
      "B) Recursively downloads the entire remote directory",
      "C) Shows a progress bar",
      "D) Reverses the transfer direction"
    ],
    answer: "B) Recursively downloads the entire remote directory",
    explanation: "In sftp, <code>get -r remote_dir</code> downloads the remote directory and all its contents recursively to the local machine."
  },
  {
    id: 9,
    type: "mcq",
    prompt: "An absolute path always starts with:",
    options: [
      "A) /",
      "B) ./",
      "C) ../",
      "D) ~"
    ],
    answer: "A) /",
    explanation: "An absolute path starts from the filesystem root <code>/</code> (e.g., <code>/home/user/docs</code>). Relative paths start from the current directory using <code>./</code> or <code>../</code>. <code>~</code> expands to the home directory but is technically a shell shorthand."
  },
  {
    id: 10,
    type: "trace",
    prompt: "Write the command to recursively remove a non-empty directory called <code>old/</code>.",
    answer: "rm -r old/",
    explanation: "<code>rm -r old/</code> removes the directory and all its contents recursively. Use with caution — this is irreversible."
  }
];

const container = document.getElementById("quiz-body");
questions.forEach((q, i) => {
  const card = document.createElement("div");
  card.className = "q-card";
  card.innerHTML = `
    <span class="q-type">${q.type}</span>
    <p class="q-prompt"><strong>Q${i+1}.</strong> ${q.prompt}</p>
    ${q.code ? `<pre>${q.code}</pre>` : ""}
    <div id="input-${q.id}"></div>`;
  container.appendChild(card);

  const inputArea = document.getElementById(`input-${q.id}`);
  if (q.type === "mcq") {
    const wrap = document.createElement("div");
    wrap.className = "mcq-opts";
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "mcq-btn";
      btn.textContent = opt;
      btn.onclick = () => {
        wrap.querySelectorAll(".mcq-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      };
      wrap.appendChild(btn);
    });
    inputArea.appendChild(wrap);
  } else {
    const ta = document.createElement("textarea");
    ta.className = "trace-input";
    ta.id = `ta-${q.id}`;
    ta.placeholder = "Type your answer…";
    inputArea.appendChild(ta);
  }
});

function grade() {
  let correct = 0;
  const rows = [];
  questions.forEach((q, i) => {
    let userAns = "";
    if (q.type === "mcq") {
      const sel = document.querySelector(`#input-${q.id} .mcq-btn.selected`);
      userAns = sel ? sel.textContent.trim() : "";
      document.querySelectorAll(`#input-${q.id} .mcq-btn`).forEach(btn => {
        btn.disabled = true;
        if (btn.textContent.trim() === q.answer) btn.classList.add("correct");
        else if (btn.classList.contains("selected")) btn.classList.add("wrong");
      });
    } else {
      const ta = document.getElementById(`ta-${q.id}`);
      userAns = ta ? ta.value.trim() : "";
      ta.disabled = true;
    }
    const ok = userAns === q.answer;
    if (ok) correct++;
    rows.push({ q, i, ok, userAns });
  });

  const res = document.getElementById("results");
  res.style.display = "block";
  const pct = Math.round(correct / questions.length * 100);
  res.innerHTML = `
    <div class="score-head">Score: ${correct} / ${questions.length} (${pct}%)</div>
    ${rows.map(({q, i, ok, userAns}) => `
      <div class="r-row ${ok ? "r-correct" : "r-wrong"}">
        ${ok ? "✓" : "✗"} <strong>Q${i+1}</strong>
        ${ok ? "— Correct" : `— Your answer: <code>${userAns || "(none)"}</code> &nbsp;|&nbsp; Expected: <code>${q.answer}</code>`}
        ${!ok ? `<div class="r-exp">${q.explanation}</div>` : ""}
      </div>`).join("")}`;
  document.getElementById("submit-btn").disabled = true;
}
</script>
</body>
</html>
